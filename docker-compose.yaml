services:
  postgres:
    image: postgres:16-alpine
    container_name: heating-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heating_db}
      POSTGRES_USER: ${POSTGRES_USER:-heating_app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
