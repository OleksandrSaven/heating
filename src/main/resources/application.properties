spring.application.name=heating-automation2026

spring.datasource.url=jdbc:postgresql://localhost:5432/heating_db
spring.datasource.username=heating_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MQTT broker
mqtt.broker-url=tcp://192.168.31.114:1883

# MQTT credentials
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}

# MQTT topic for telemetry
mqtt.topic.telemetry=heating/+/telemetry
mqtt.topic.status=heating/+/status